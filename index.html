<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Bottle Jump 3D — APK 复刻</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="game-canvas"></canvas>
    <div id="ui-root">
      <!-- 加载 -->
      <section class="screen" id="screen-loading">
        <img class="splash-logo" src="assets/sprites/globalgamemanagers.assets__1508__SplashLogo.png" alt="AZUR GAMES">
        <div class="loading-bar"><div class="loading-fill"></div></div>
        <div class="loading-text">LOADING<span class="dots"><i>.</i><i>.</i><i>.</i></span></div>
      </section>
      <!-- 主菜单 -->
      <section class="screen hidden" id="screen-menu">
        <img class="menu-logo" src="assets/sprites/sharedassets0.assets__737__BgGameLogo.png" alt="">
        <div class="menu-hand"><img src="assets/sprites/sharedassets0.assets__709__Hand.png" alt=""></div>
        <button class="icon-top left" id="btn-settings"><img src="assets/sprites/sharedassets0.assets__692__IcnSettings.png" alt=""></button>
        <div class="menu-coins"><span id="menu-coins">0</span><img src="assets/sprites/sharedassets0.assets__717__IcnCap.png" alt=""></div>
        <div class="menu-bottom">
          <button class="b3" id="btn-ads"><img src="assets/sprites/sharedassets0.assets__731__BtnNoAds.png" alt=""></button>
          <button class="b3 center" id="btn-play"><img class="ico" src="assets/sprites/sharedassets0.assets__702__IcnBottle.png" alt=""></button>
          <button class="b3" id="btn-vip"><img src="assets/sprites/sharedassets0.assets__751__BtnVipModepng.png" alt=""></button>
        </div>
      </section>
      <!-- 图鉴 -->
      <section class="screen hidden" id="screen-vitrine">
        <div class="vitrine-wall"></div>
        <div class="vitrine-coins"><span id="vitrine-coins">0</span><img src="assets/sprites/sharedassets0.assets__717__IcnCap.png" alt=""></div>
        <button class="icon-top left back" id="btn-vitrine-back"><img src="assets/sprites/sharedassets0.assets__716__IcnBack.png" alt=""></button>
        <div class="vitrine-grid" id="vitrine-grid"></div>
        <button class="btn-unlock" id="btn-unlock"><span>随机解锁 <b id="unlock-cost">1000</b></span></button>
      </section>
      <!-- 关卡内 HUD -->
      <section class="screen hidden" id="screen-hud">
        <div class="hud-progress" id="hud-progress">
          <span class="num" id="prog-l">15</span>
          <div class="bar"><div class="fill" id="prog-fill"></div></div>
          <span class="num" id="prog-r">16</span>
        </div>
        <div class="hud-coins"><span id="hud-coins">0</span><img src="assets/sprites/sharedassets0.assets__717__IcnCap.png" alt=""></div>
        <button class="round-btn" id="btn-pause"><i></i><i></i></button>
        <div class="tap-hint" id="tap-hint"><img src="assets/sprites/sharedassets0.assets__722__Tap.png" alt=""></div>
      </section>
      <!-- 失败 -->
      <section class="screen hidden" id="screen-fail">
        <div class="modal">
          <div class="modal-title">OH NO!</div>
          <div class="modal-sub">BOTTLE DIED</div>
          <button class="btn-modal" id="btn-retry"><img src="assets/sprites/sharedassets0.assets__744__BtnGreenBack.png" alt=""><span>RETRY</span></button>
          <button class="btn-modal small" id="btn-fail-menu"><img src="assets/sprites/sharedassets0.assets__725__BtnLongWhite.png" alt=""><span>MENU</span></button>
        </div>
      </section>
      <!-- 过关 -->
      <section class="screen hidden" id="screen-done">
        <div class="modal">
          <div class="modal-title">LEVEL COMPLETE</div>
          <div class="modal-sub" id="done-coins">+0</div>
          <button class="btn-modal" id="btn-next"><img src="assets/sprites/sharedassets0.assets__744__BtnGreenBack.png" alt=""><span>NEXT</span></button>
          <button class="btn-modal small" id="btn-done-menu"><img src="assets/sprites/sharedassets0.assets__725__BtnLongWhite.png" alt=""><span>MENU</span></button>
        </div>
      </section>
      <!-- 设置 -->
      <section class="screen hidden" id="screen-settings">
        <div class="modal settings">
          <div class="modal-title">SETTINGS</div>
          <button class="btn-toggle" id="btn-sound2"><img id="img-sound2" src="assets/sprites/sharedassets0.assets__742__IcnSoundOn.png" alt=""><span>SOUND</span></button>
          <button class="btn-toggle" id="btn-vibro"><img id="img-vibro" src="assets/sprites/sharedassets0.assets__706__IcnVibro.png" alt=""><span>VIBRATION</span></button>
          <button class="btn-toggle" id="btn-orient"><span id="lbl-orient">横屏模式：关</span></button>
          <button class="btn-close" id="btn-settings-close"><img src="assets/sprites/sharedassets0.assets__723__IcnClose.png" alt=""></button>
        </div>
      </section>
    <div id="toast" class="hidden"></div>
  </div>
</div>
<script src="js/three.min.js"></script>
<script src="js/engine.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
</body>
</html>
